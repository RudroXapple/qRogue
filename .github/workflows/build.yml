name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get qFlipper assets
        run: |
          git clone --depth 1 https://github.com/flipperdevices/qFlipper /tmp/qFlipper
          bash prepare_assets.sh /tmp/qFlipper/application/assets

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer Cython==0.29.37

      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show error lines
        if: failure()
        run: |
          echo "=== ERROR LINES ==="
          grep -v '^# ' build.log | grep -n -i -E "error|fatal|failed|not found|no such" | cut -c1-220 | tail -n 25 || true
          echo "=== LAST 50 LINES (without env dump) ==="
          grep -v '^# ' build.log | tail -n 50 | cut -c1-220

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
